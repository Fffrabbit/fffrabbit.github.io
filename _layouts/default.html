<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />

    <!-- Teeman omat tyylit (orderedlist-pohja) -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />

    <!-- Omat lisätyylit animaatioilla -->
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />

    <!-- Tabler-ikonit (svg-ikonifontti) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  </head>

  <body>

    <!-- ======== HEADER / HERO ======== -->
    <header class="page-header">
      <div class="wrapper">

        <!-- Nimiympyrä -->
        <div class="avatar-circle" aria-hidden="true">PK</div>

        <!-- Nimi ja ammattinimike -->
        <h1>{{ site.title | default: "Petteri Kuisma" }}</h1>
        <p class="tagline">Koulutusteknologian maisteri (FM)</p>

        <!-- Nopeat linkit -->
        <nav aria-label="Ulkoiset profiilit">
          <a href="https://www.linkedin.com/in/petterikuisma/"
             target="_blank" rel="noopener noreferrer">
            <i class="ti ti-brand-linkedin" aria-hidden="true"></i> LinkedIn
          </a>
          <a href="https://github.com/Fffrabbit"
             target="_blank" rel="noopener noreferrer">
            <i class="ti ti-brand-github" aria-hidden="true"></i> GitHub
          </a>
          <a href="https://github.com/Fffrabbit/it-opas/"
             target="_blank" rel="noopener noreferrer">
            <i class="ti" aria-hidden="true"></i> IT-opas
          </a>
        </nav>

      </div>
    </header>

    <!-- ======== PÄÄSISÄLTÖ ======== -->
    <div class="wrapper">
      <section class="main-content">

        <!--
          OHJE: Markdown-tiedostosi sisältö (index.md jne.) tulostuu tähän
          automaattisesti. Voit myös lisätä alla olevat HTML-kortit suoraan
          markdown-tiedostoon käyttämällä raakaa HTML:ää Jekyllissä.
          Nämä kortit ovat esimerkkejä — muokkaa tekstit omaksesi.
        -->
        {{ content }}

        <!--
          VINKKI: Jos haluat projektikorttien näyttävän paremmalta
          kuin pelkkä markdown-lista, voit lisätä ne index.md-tiedostoon
          näin (HTML toimii suoraan markdown-tiedostoissa):

          <div class="project-card reveal">
            <span class="badge">Pro gradu · 2024</span>
            <h3>Älypuhelimet ja kognitiivinen kuormitus</h3>
            <p>Tutkimuksen kuvaus tähän.</p>
          </div>

          Ja osaamiskorteille:

          <div class="skills-grid">
            <div class="skill-card reveal">
              <div class="skill-label">Pedagogiikka</div>
              Digipedagogiikka · Moodle · Oppimisanalytiikka
            </div>
            <div class="skill-card reveal">
              <div class="skill-label">Tekninen</div>
              HTML/CSS · JavaScript · React
            </div>
          </div>
        -->

      </section>
    </div>

    <!-- ======== FOOTER ======== -->
    <footer>
      <div class="wrapper">
        <p>
          &copy; {{ 'now' | date: "%Y" }} Petteri Kuisma &nbsp;·&nbsp;
          <a href="https://github.com/Fffrabbit/fffrabbit.github.io"
             target="_blank" rel="noopener noreferrer">Lähdekoodi GitHubissa</a>
        </p>
      </div>
    </footer>

    <!-- ======== SCROLL-REVEAL JS ======== -->
    <script>
      (function () {
        // Lisää .reveal-luokka kaikkiin h2, h3, p, ul ja section-elementteihin
        // jotka ovat .main-content:n sisällä, sekä kaikkiin .reveal-luokan
        // elementteihin jotka on kirjoitettu HTML:ssä suoraan.
        var selectors = [
          '.main-content > h2',
          '.main-content > h3',
          '.main-content > p',
          '.main-content > ul',
          '.main-content > .project-card',
          '.main-content > .skills-grid',
          '.main-content > .contact-links',
          '.reveal'
        ];

        var elements = document.querySelectorAll(selectors.join(', '));

        // Poista duplikaatit (jos elementti vastaa useampaa selektoria)
        var unique = Array.from(new Set(Array.from(elements)));

        unique.forEach(function (el) {
          el.classList.add('reveal');
        });

        // IntersectionObserver: lisää .visible kun elementti tulee näkyviin
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target); // animoi vain kerran
              }
            });
          },
          { threshold: 0.12 }
        );

        unique.forEach(function (el) {
          observer.observe(el);
        });
      })();
    </script>

  </body>
</html>
